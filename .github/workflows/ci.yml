name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 语法检查（全部源码模块 + tests/tools）
        run: python -m compileall -q advance.py cpr_meta.py daw_ctrl.py dpi.py hotspot.py kbd_auto.py midi_bridge.py obs_ctrl.py obs_ws.py pedal.py setlist_gui.py song_meta.py web_auth.py web_remote.py webui.py tests tools
      - name: 离线测试全量（全部无需 OBS/loopMIDI/Cubase 在场）
        run: |
          python -m pip install pytest sv-ttk -q   # dpi.py 顶层 import sv_ttk，缺了收集期全灭
          python -m pytest tests/ -q
      - name: 前端语法冒烟（webapp/app.js）
        run: node --check webapp/app.js

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift 纯逻辑测试（CubeRemoteCore）
        run: |
          cd ios/CubeRemoteCore
          swift test
      - name: iOS 无签名模拟器编译
        run: |
          xcodebuild -project ios/CubeRemote.xcodeproj -scheme CubeRemote \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

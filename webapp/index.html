<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Setlist Manager</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div id="shell">
  <nav id="side">
    <div id="brand">Cube</div>
    <button class="nav b-console" data-page="console">主控台</button>
    <button class="nav b-setlist" data-page="setlist">编排</button>
    <button class="nav b-points" data-page="points">定位点</button>
    <button class="nav b-pedal" data-page="pedal">踩钉</button>
    <button class="nav b-kbd" data-page="kbd">键盘</button>
    <button class="nav b-vj" data-page="vj">VJ</button>
    <button class="nav b-settings" data-page="settings">设置</button>
    <button class="nav b-log" data-page="log">日志</button>
    <div class="side-gap"></div>
    <button id="btn-show" title="演出模式">⛶ 演出</button>
  </nav>
  <main id="main">
    <section class="page" id="p-console">
      <div id="now" class="big">…</div>
      <div id="next" class="mid">NEXT —</div>
      <div id="clock" class="mid dim">0:00 | 0:00</div>
      <div id="bar"><div id="barfill"></div></div>
      <div id="transport">
        <button data-cmd="play" class="go">▶ 开始</button>
        <button data-cmd="pause">⏸ 暂停</button>
        <button data-cmd="resume">▷ 继续</button>
        <button data-cmd="rewind">⟲ 回零</button>
        <button data-cmd="prev">⏮ 上一首</button>
        <button data-cmd="next">⏭ 下一首</button>
        <button data-cmd="panic" class="panic">■ 全停</button>
      </div>
      <div id="console-list" class="list"></div>
    </section>
    <section class="page" id="p-setlist">
      <h2>编排</h2>
      <div class="cols">
        <div class="col">
          <div class="colhead">素材库 <span class="dim" id="lib-n"></span></div>
          <div id="lib" class="list"></div>
        </div>
        <div class="col">
          <div class="colhead">播放列表 <span class="dim" id="pl-n"></span>
            <button id="pl-clear" class="mini danger">清空</button></div>
          <div id="pl" class="list"></div>
        </div>
      </div>
    </section>
    <section class="page" id="p-points">
      <h2>定位点 <select id="pt-proj"></select></h2>
      <div id="pt-list" class="list"></div>
      <div id="pt-edit">
        <label>名称 <input id="pt-name"></label>
        <label>开始 <input id="pt-s" placeholder="分:秒"></label>
        <label>结束 <input id="pt-e" placeholder="分:秒"></label>
        <button id="pt-save">保存修改</button>
        <button id="pt-add">添加（开始=当前时码）</button>
        <button id="pt-del" class="danger">删除选中</button>
        <button id="pt-up" class="mini">上移</button>
        <button id="pt-down" class="mini">下移</button>
        <label class="chk"><input type="checkbox" id="pt-on"> 启用定位点</label>
      </div>
    </section>
    <section class="page" id="p-pedal">
      <h2>踩钉 <span id="pedal-conn" class="dim"></span></h2>
      <div class="form">
        <label>提示名 <input id="pd-hint"></label>
        <label>设备名过滤 <input id="pd-dev"></label>
        <label>单踩动作
          <select id="pd-g-play"><option value="play">播放/暂停</option>
            <option value="next">下一首</option></select></label>
        <label>双踩动作
          <select id="pd-g-next"><option value="play">播放/暂停</option>
            <option value="next">下一首</option></select></label>
        <label>双踩窗秒 <input id="pd-win" class="num"></label>
        <label class="chk"><input type="checkbox" id="pd-intercept"> 拦截硬件原键</label>
        <label class="chk"><input type="checkbox" id="pd-remote"> 平板转发踩钉</label>
        <button id="pd-save">保存并应用</button>
      </div>
      <p class="dim">单踩=播放/暂停切换，双踩=下一首；动作可对调。改配置后点「保存并应用」即时生效。</p>
    </section>
    <section class="page" id="p-kbd">
      <h2>键盘自动化 <span id="kbd-song" class="dim"></span></h2>
      <div class="form">
        <label>JUNO 输入 <input id="kb-jin"></label>
        <label>JUNO 输出 <input id="kb-jout"></label>
        <label>AX-09 输入 <input id="kb-ain"></label>
        <label>AX-09 输出 <input id="kb-aout"></label>
        <button id="kb-save">保存并应用</button>
      </div>
      <h3>JUNO 音色槽 <span class="dim">移调
        <button id="kb-jdown" class="mini">−1</button>
        <span id="kb-jshift">0</span>
        <button id="kb-jup" class="mini">+1</button></span></h3>
      <div id="kb-slots" class="list"></div>
      <h3>AX-09 音色槽 <span class="dim">移调
        <button id="kb-adown" class="mini">−1</button>
        <span id="kb-ashift">0</span>
        <button id="kb-aup" class="mini">+1</button></span></h3>
      <div id="kb-axslots" class="list"></div>
    </section>
    <section class="page" id="p-vj">
      <h2>VJ 联动 <span id="vj-obs" class="dim"></span></h2>
      <div class="form">
        <label>VJ显示位置 <select id="vj-mon"></select></label>
        <label>媒体输入名 <input id="vj-media"></label>
        <label>视频目录 <input id="vj-root" class="wide"></label>
        <label class="chk"><input type="checkbox" id="vj-mute"> 静音播放</label>
        <button id="vj-save">保存并应用</button>
      </div>
      <div id="vj-sum" class="sumlist"></div>
    </section>
    <section class="page" id="p-settings">
      <h2>设置</h2>
      <div class="form">
        <h3>联动端口</h3>
        <label>时码端口 <input id="st-clock" class="wide"></label>
        <label>VJ 端口 <input id="st-vj" class="wide"></label>
        <label>键盘端口 <input id="st-kb" class="wide"></label>
        <h3>行为</h3>
        <label class="chk"><input type="checkbox" id="st-auto"> 播完自动切换</label>
        <label class="chk"><input type="checkbox" id="st-cont"> 切完自动播放</label>
        <label class="chk"><input type="checkbox" id="st-top"> 窗口置顶</label>
        <label class="chk"><input type="checkbox" id="st-confirm"> 切歌确认</label>
        <label class="chk"><input type="checkbox" id="st-exit"> 退出时关闭被控软件</label>
        <h3>目录与工程</h3>
        <label>工程库根 <input id="st-root" class="wide"></label>
        <label>Cubase 程序 <input id="st-exe" class="wide"></label>
        <label class="chk"><input type="checkbox" id="st-autosave"> 切歌自动保存</label>
        <h3>移动端遥控</h3>
        <label class="chk"><input type="checkbox" id="st-web"> 启用遥控</label>
        <label>模式 <select id="st-mode"><option value="hotspot">热点</option>
          <option value="lan">局域网</option></select></label>
        <label>网页端口 <input id="st-srv" class="num"></label>
        <label>APP 端口 <input id="st-app" class="num"></label>
        <label>翻谱端口 <input id="st-tsk" class="num"></label>
        <label>翻谱 MIDI 口 <input id="st-pg" class="wide"></label>
        <label>网卡 <select id="st-ip"></select></label>
        <button id="st-save" class="go">保存并应用</button>
      </div>
    </section>
    <section class="page" id="p-log">
      <h2>日志</h2>
      <div id="log" class="log"></div>
    </section>
  </main>
</div>
<footer id="statusbar">
  <span class="lamp" id="l-daw">DAW <i>·</i></span>
  <span class="lamp" id="l-obs">OBS <i>·</i></span>
  <span class="lamp" id="l-loop">loopMIDI <i>·</i></span>
  <span class="lamp" id="l-pedal">踩钉 <i>·</i></span>
  <span class="lamp" id="l-hot">热点 <i>·</i></span>
  <span class="lamp" id="l-remote">遥控 <i>·</i></span>
  <span id="tstate" class="dim"></span>
</footer>
<script type="module" src="/app/app.js"></script>
</body>
</html>
